name: Build Release Packages

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DISPLAY_NAME: FreeAi
  APP_NAME: free-ai-app
  FRONTEND_REPOSITORY: wfu-work/free-ai-web
  WAILS_VERSION: v3.0.0-alpha.95

jobs:
  frontend:
    name: Build frontend assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FRONTEND_REPOSITORY }}
          path: free-ai-web

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: free-ai-web/.nvmrc
          cache: pnpm
          cache-dependency-path: free-ai-web/pnpm-lock.yaml

      - name: Enable pnpm
        shell: bash
        run: corepack enable

      - name: Install frontend dependencies
        shell: bash
        working-directory: free-ai-web
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        shell: bash
        working-directory: free-ai-web
        run: pnpm build

      - name: Check frontend output
        shell: bash
        working-directory: free-ai-web
        run: test -f dist/freeai-web/browser/index.html

      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: free-ai-web/dist/freeai-web
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/freeai-web

      - name: Set release version
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Build DMG
        shell: bash
        run: |
          set -euo pipefail
          make dmg \
            ARCH="${{ matrix.arch }}" \
            VERSION="${RELEASE_VERSION}" \
            DMG_NAME="${APP_DISPLAY_NAME}-${RELEASE_VERSION}-macos-${{ matrix.arch }}.dmg"
          mkdir -p dist
          cp "bin/${APP_DISPLAY_NAME}-${RELEASE_VERSION}-macos-${{ matrix.arch }}.dmg" dist/

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: package-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    needs: frontend
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/freeai-web

      - name: Set release version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${env:WAILS_VERSION}

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer
        shell: pwsh
        run: |
          wails3 task windows:package ARCH=${{ matrix.arch }} FORMAT=nsis INSTALL_SCOPE=user
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "bin/${env:APP_NAME}-${{ matrix.arch }}-installer.exe" "dist/${env:APP_DISPLAY_NAME}-${env:RELEASE_VERSION}-windows-${{ matrix.arch }}-setup.exe"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: package-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    env:
      GOARCH: ${{ matrix.arch }}
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/freeai-web

      - name: Set release version
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Build Linux packages
        shell: bash
        run: |
          set -euo pipefail
          wails3 task linux:package ARCH="${{ matrix.arch }}"
          mkdir -p dist
          for file in bin/*; do
            case "$file" in
              *.AppImage|*.deb|*.rpm|*.pkg.tar.*)
                cp "$file" "dist/${APP_DISPLAY_NAME}-${RELEASE_VERSION}-linux-${{ matrix.arch }}-$(basename "$file")"
                ;;
            esac
          done
          test "$(find dist -type f | wc -l)" -gt 0

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: package-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - macos
      - windows
      - linux
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        shell: bash
        run: find release-assets -type f -maxdepth 1 -print | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.APP_DISPLAY_NAME }} ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/*
