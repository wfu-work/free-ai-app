changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: 新功能
      labels:
        - enhancement
        - feature
    - title: 问题修复
      labels:
        - bug
        - fix
    - title: 文档与工程改进
      labels:
        - documentation
        - dependencies
        - ci
    - title: 其他变更
      labels:
        - "*"
